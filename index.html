<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tout vient de ce site : aucune connexion vers un autre serveur n'est permise.
       wasm-unsafe-eval : le moteur d'OCR est en WebAssembly. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' blob: data:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>Contrôle des figures</title>
  <meta name="description" content="Voir une figure à sa taille imprimée dans la Revue ou un livre SZH/CSPS, et vérifier la taille et le contraste de ses textes.">
  <link rel="stylesheet" href="style.css">
  <style id="style-impression"></style>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Simulation des daltonismes : matrices de Machado, Oliveira et Fernandes (2009),
       sévérité 1, appliquées en RVB linéaire. -->
  <svg class="filtres" aria-hidden="true" focusable="false">
    <filter id="f-deuteranopie" color-interpolation-filters="linearRGB">
      <feColorMatrix type="matrix" values="0.367322 0.860646 -0.227968 0 0  0.280085 0.672501 0.047413 0 0  -0.011820 0.042940 0.968881 0 0  0 0 0 1 0"/>
    </filter>
    <filter id="f-protanopie" color-interpolation-filters="linearRGB">
      <feColorMatrix type="matrix" values="0.152286 1.052583 -0.204868 0 0  0.114503 0.786281 0.099216 0 0  -0.003882 -0.048116 1.051998 0 0  0 0 0 1 0"/>
    </filter>
    <filter id="f-tritanopie" color-interpolation-filters="linearRGB">
      <feColorMatrix type="matrix" values="1.255528 -0.076749 -0.178779 0 0  -0.078411 0.930809 0.147602 0 0  0.004733 0.691367 0.303900 0 0  0 0 0 1 0"/>
    </filter>
  </svg>

  <header class="entete">
    <div class="entete-texte">
      <h1 data-t="titre"></h1>
      <p data-t="intro"></p>
    </div>
    <button type="button" id="langue" class="lien"></button>
  </header>

  <main>
    <!-- Quatre étapes en accordéon : une seule ouverte à la fois, les étapes 2 à 4
         inaccessibles tant qu'aucune figure n'est choisie. -->
    <ol class="etapes">
      <li class="etape" id="etape-1">
        <h2 class="etape-titre">
          <button type="button" class="etape-bouton" data-etape="1" aria-controls="etape-1-corps">
            <span class="etape-num">1</span><span class="etape-nom" data-t="etape1"></span><span class="etape-resume" id="resume-1"></span>
          </button>
        </h2>
        <div class="etape-corps" id="etape-1-corps">
          <div id="choix-figure">
            <label id="depot" class="depot" tabindex="0">
              <input type="file" id="fichier" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml,application/pdf,.svg,.pdf" hidden>
              <strong data-t="deposer"></strong>
              <span data-t="formatsAcceptes"></span>
              <span class="discret" data-t="confidentialite"></span>
            </label>
            <button type="button" id="exemple" class="lien" data-t="exemple"></button>
          </div>
          <div id="figure-choisie" class="figure-choisie" hidden>
            <img id="figure-miniature" alt="">
            <span class="figure-nom"><b id="figure-nom"></b><small id="figure-taille" class="discret"></small></span>
            <button type="button" id="autre-figure" data-t="autreFigure"></button>
          </div>
          <p id="erreur" class="erreur" role="alert" hidden></p>
        </div>
      </li>

      <li class="etape" id="etape-2">
        <h2 class="etape-titre">
          <button type="button" class="etape-bouton" data-etape="2" aria-controls="etape-2-corps">
            <span class="etape-num">2</span><span class="etape-nom" data-t="etape2"></span><span class="etape-resume" id="resume-2"></span>
          </button>
        </h2>
        <div class="etape-corps" id="etape-2-corps">
          <div class="reglages">
            <fieldset class="groupe-choix">
              <legend data-t="format"></legend>
              <label><input type="radio" name="format" value="revue"> <span data-t="formatRevue"></span></label>
              <label><input type="radio" name="format" value="livre"> <span data-t="formatLivre"></span></label>
            </fieldset>
            <label class="groupe-choix"><span class="legende" data-t="largeur"></span>
              <select id="proportion">
                <option value="" data-t="largeurAuto"></option>
                <option value="1" data-t="largeur100"></option>
                <option value="0.75" data-t="largeur75"></option>
                <option value="0.5" data-t="largeur50"></option>
              </select>
            </label>
            <fieldset class="groupe-choix">
              <legend class="legende-info"><span data-t="seuil"></span>
                <span class="info"><button type="button" class="info-bouton" id="info-seuil-bouton" aria-expanded="false" aria-controls="info-seuil" data-t-aria="seuilInfoAria">i</button><span class="bulle" id="info-seuil" role="note" hidden data-t="seuilInfo"></span></span>
              </legend>
              <label><input type="radio" name="seuil" value="60"> <span data-t="seuil60"></span></label>
              <label><input type="radio" name="seuil" value="75"> <span data-t="seuil75"></span></label>
            </fieldset>
          </div>
          <div class="pied-etape">
            <button type="button" class="principal" data-aller="3" data-t="continuer"></button>
          </div>
        </div>
      </li>

      <li class="etape" id="etape-3">
        <h2 class="etape-titre">
          <button type="button" class="etape-bouton" data-etape="3" aria-controls="etape-3-corps">
            <span class="etape-num">3</span><span class="etape-nom" data-t="etape3"></span><span class="etape-resume" id="resume-3"></span>
          </button>
        </h2>
        <div class="etape-corps" id="etape-3-corps">
          <p class="calibration-pourquoi" data-t="calibrationPourquoi"></p>
          <p data-t="calibrationAide"></p>
          <div class="carte-zone"><div id="carte" class="carte"></div></div>
          <div class="carte-commandes">
            <button type="button" id="carte-moins" data-t="plusPetit"></button>
            <input type="range" id="carte-curseur" min="2" max="9" step="0.01" data-t-aria="calibrationCurseur">
            <button type="button" id="carte-plus" data-t="plusGrand"></button>
          </div>
          <p class="discret" data-t="calibrationGardee"></p>
          <div class="pied-etape">
            <button type="button" id="carte-reinitialiser" class="lien" data-t="reinitialiser"></button>
            <button type="button" id="carte-passer" data-t="passer"></button>
            <button type="button" id="carte-valider" class="principal" data-t="valider"></button>
          </div>
        </div>
      </li>

      <li class="etape" id="etape-4">
        <h2 class="etape-titre">
          <button type="button" class="etape-bouton" data-etape="4" aria-controls="etape-4-corps">
            <span class="etape-num">4</span><span class="etape-nom" data-t="etape4"></span><span class="etape-resume" id="resume-4"></span>
          </button>
        </h2>
        <div class="etape-corps" id="etape-4-corps">
          <!-- Une seule vue de l'analyse à la fois ; la barre d'onglets reste en haut. -->
          <div class="onglets-analyse" role="tablist" data-t-aria="vuesAnalyse">
            <button type="button" role="tab" id="onglet-page" data-vue="vue-page" aria-controls="vue-page" data-t="navPage"></button>
            <button type="button" role="tab" id="onglet-textes" data-vue="rapport" aria-controls="rapport" data-t="sectionTextes"></button>
            <button type="button" role="tab" id="onglet-couleurs" data-vue="vue-couleurs" aria-controls="vue-couleurs" data-t="navCouleurs"></button>
            <button type="button" role="tab" id="onglet-projection" data-vue="vue-projection" aria-controls="vue-projection" data-t="navProjection"></button>
          </div>

          <section id="vue-page" class="vue" role="tabpanel" aria-labelledby="onglet-page">
            <div class="commandes">
              <fieldset class="bascule">
                <label><input type="radio" name="vue" value="reelle" checked> <span data-t="vueReelle"></span></label>
                <label><input type="radio" name="vue" value="page"> <span data-t="vuePage"></span></label>
              </fieldset>
              <button type="button" id="calibrer" data-t="calibrer"></button>
              <button type="button" id="imprimer" data-t="imprimer"></button>
            </div>
            <p class="infos"><span id="dimensions"></span> <span id="calibration" class="discret"></span></p>
            <ul id="alertes-page" class="alertes"></ul>
            <div id="cadre-page" class="cadre-page"><div id="page" class="page"></div></div>
            <p class="discret" data-t="conseilImpression"></p>
            <p class="discret" data-t="conseilPdf"></p>
          </section>

          <section id="rapport" class="vue rapport" role="tabpanel" aria-labelledby="onglet-textes" hidden>
            <div class="titre-section">
              <h3 data-t="sectionTextes"></h3>
              <button type="button" id="imprimer-rapport" data-t="imprimerRapport" hidden></button>
            </div>
            <p id="rapport-fichier" class="discret"></p>
            <p id="statut" class="statut" aria-live="polite"></p>
            <div id="bilan" class="bilan" hidden></div>
            <div id="ensemble"></div>
            <ul class="niveaux" id="niveaux" hidden>
              <li class="corriger"><span class="symbole" aria-hidden="true">✕</span> <b data-t="niveau_corriger"></b> <span data-t="legende_corriger"></span></li>
              <li class="ameliorer"><span class="symbole" aria-hidden="true">!</span> <b data-t="niveau_ameliorer"></b> <span data-t="legende_ameliorer"></span></li>
              <li class="ok"><span class="symbole" aria-hidden="true">✓</span> <b data-t="niveau_ok"></b> <span data-t="legende_ok"></span></li>
            </ul>
            <div class="explorateur">
              <div class="explorateur-figure">
                <div class="puces" id="puces"></div>
                <div class="analyse-figure" id="analyse-figure"></div>
              </div>
              <div class="explorateur-panneau" id="panneau" role="tabpanel" aria-live="polite"></div>
            </div>
            <div class="cartes-impression">
              <h4 id="zones-titre" hidden></h4>
              <ol id="zones" class="zones"></ol>
            </div>
            <p id="zones-reste" class="discret"></p>
            <details id="details-textes" hidden>
              <summary id="details-titre"></summary>
              <div class="analyse-table">
                <table id="table-textes">
                  <thead><tr>
                    <th scope="col" data-t="colTexte"></th>
                    <th scope="col" data-t="colTaille"></th>
                    <th scope="col" data-t="colContraste"></th>
                    <th scope="col" data-t="colCouleurs"></th>
                  </tr></thead>
                  <tbody></tbody>
                </table>
              </div>
            </details>
            <p id="note-mesure" class="discret"></p>
          </section>

          <section id="vue-projection" class="vue" role="tabpanel" aria-labelledby="onglet-projection" hidden>
            <div class="commandes">
              <fieldset class="bascule">
                <label><input type="radio" name="salle" value="petite" checked> <span data-t="sallePetite"></span></label>
                <label><input type="radio" name="salle" value="grande"> <span data-t="salleGrande"></span></label>
              </fieldset>
              <label class="champ-nombre"><span data-t="largeurEcran"></span> <input type="number" id="salle-largeur" min="0.5" max="20" step="0.05"> m</label>
              <label class="champ-nombre"><span data-t="distanceRang"></span> <input type="number" id="salle-distance" min="1" max="60" step="0.5"> m</label>
            </div>
            <p id="projection-consigne"></p>
            <div class="salle"><div class="diapo" id="diapo"></div></div>
            <div id="projection-bilan" class="bilan"></div>
            <p class="discret" data-t="projectionNote"></p>
          </section>

          <section id="vue-couleurs" class="vue" role="tabpanel" aria-labelledby="onglet-couleurs" hidden>
            <p data-t="couleursAide"></p>
            <ul id="couleurs" class="couleurs"></ul>
          </section>
        </div>
      </li>
    </ol>
  </main>

  <footer class="pied"><p data-t="pied"></p></footer>

  <dialog id="dialogue-couleurs" class="dialogue-vue">
    <div class="vue-entete">
      <h2 data-t="sectionCouleurs"></h2>
      <button type="button" id="vue-fermer" data-t="fermer"></button>
    </div>
    <div id="vues-onglets" class="vues-onglets" role="tablist"></div>
    <div class="vue-cadre"><img id="vue-grande" alt=""></div>
  </dialog>
</body>
</html>
