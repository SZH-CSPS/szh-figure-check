<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <!-- Figure d'exemple, données fictives. Elle réunit exprès les défauts que l'outil signale :
       graduations trop petites et trop claires, titre d'axe vertical trop petit, valeur
       blanche sur jaune, source minuscule, rouge et vert seuls pour distinguer deux séries. -->
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="80" y="64" font-size="34" font-weight="bold" fill="#1d1d1b">Participation aux mesures de soutien</text>

  <g stroke="#cfcfcf" stroke-width="1.5">
    <line x1="140" y1="160" x2="1140" y2="160"/>
    <line x1="140" y1="290" x2="1140" y2="290"/>
    <line x1="140" y1="420" x2="1140" y2="420"/>
    <line x1="140" y1="550" x2="1140" y2="550"/>
  </g>
  <line x1="140" y1="680" x2="1140" y2="680" stroke="#1d1d1b" stroke-width="2"/>

  <g font-size="15" fill="#a6a6a6" text-anchor="end">
    <text x="125" y="685">0 %</text>
    <text x="125" y="555">25 %</text>
    <text x="125" y="425">50 %</text>
    <text x="125" y="295">75 %</text>
    <text x="125" y="165">100 %</text>
  </g>
  <text transform="translate(52 420) rotate(-90)" font-size="16" fill="#1d1d1b" text-anchor="middle">Part des élèves</text>

  <g>
    <rect x="190" y="342" width="90" height="338" fill="#d7301f"/>
    <rect x="290" y="420" width="90" height="260" fill="#1a9850"/>
    <rect x="450" y="290" width="90" height="390" fill="#d7301f"/>
    <rect x="550" y="368" width="90" height="312" fill="#1a9850"/>
    <rect x="710" y="238" width="90" height="442" fill="#d7301f"/>
    <rect x="810" y="342" width="90" height="338" fill="#1a9850"/>
    <rect x="970" y="461" width="90" height="219" fill="#f2c53d"/>
    <rect x="1070" y="498" width="60" height="182" fill="#f2c53d"/>
  </g>
  <text x="1015" y="500" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">42 %</text>

  <g font-size="24" fill="#1d1d1b" text-anchor="middle">
    <text x="285" y="716">Berne</text>
    <text x="545" y="716">Vaud</text>
    <text x="805" y="716">Zurich</text>
    <text x="1050" y="716">Moyenne</text>
  </g>

  <g font-size="22" fill="#1d1d1b">
    <rect x="760" y="96" width="22" height="22" fill="#d7301f"/>
    <text x="792" y="114">2024</text>
    <rect x="880" y="96" width="22" height="22" fill="#1a9850"/>
    <text x="912" y="114">2025</text>
  </g>

  <text x="80" y="772" font-size="13" fill="#bdbdbd">Source : enquête fictive, 2026</text>
</svg>
