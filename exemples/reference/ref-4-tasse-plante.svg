<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Figure de référence 4 (illustration) : une tasse bleu vif et une plante en pot sur une
       table. Mur crème uni (le fond), table pastel en léger dégradé, tasse en léger dégradé
       avec son anse et un reflet doux, pot orange vif en léger dégradé, rebord du pot, six
       feuilles de deux verts. Attendu : une zone par élément ; le reflet doux appartient à la
       tasse. L'ombre portée, presque de la couleur de la table, le petit cœur sur la tasse, les
       grains de terre et les points du pot sont des micro-éléments : aucun ne doit sortir. -->
  <defs>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ead9c3"/><stop offset="1" stop-color="#dcc5a9"/></linearGradient>
    <linearGradient id="tasse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2585e0"/><stop offset="1" stop-color="#1867b8"/></linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ef6c1a"/><stop offset="1" stop-color="#d4520c"/></linearGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="flou" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1200" height="800" fill="#fbf7f0"/>
  <rect data-zone="table" x="0" y="560" width="1200" height="240" fill="url(#table)"/>

  <!-- Ombres portées, presque de la couleur de la table : pas des zones. -->
  <ellipse cx="380" cy="600" rx="140" ry="18" fill="#cdb597" filter="url(#flou)" opacity="0.6"/>
  <ellipse cx="820" cy="600" rx="120" ry="16" fill="#cdb597" filter="url(#flou)" opacity="0.6"/>

  <!-- Tasse : corps, anse, reflet doux, petit cœur. -->
  <g data-zone="tasse">
    <path d="M260 380 L500 380 L485 570 Q482 595 455 595 L305 595 Q278 595 275 570 Z" fill="url(#tasse)"/>
    <path d="M492 420 C580 420 580 540 482 545" fill="none" stroke="#1867b8" stroke-width="22"/>
  </g>
  <rect x="300" y="400" width="34" height="170" rx="17" fill="url(#reflet)"/>
  <path d="M380 470 c-8 -10 -22 -2 -14 8 l14 12 l14 -12 c8 -10 -6 -18 -14 -8 z" fill="#ffffff"/>

  <!-- Vapeur : traits clairs, tolérés. -->
  <g fill="none" stroke="#d6d0c6" stroke-width="5" stroke-linecap="round" data-tolere="vapeur">
    <path d="M340 350 c-20 -30 20 -50 0 -80"/><path d="M390 345 c-20 -30 20 -50 0 -80"/><path d="M440 350 c-20 -30 20 -50 0 -80"/>
  </g>

  <!-- Plante : six feuilles qui partent de la tige, de deux verts. -->
  <rect data-tolere="tige" x="815" y="300" width="10" height="160" fill="#2b8a3e"/>
  <path data-zone="feuille-1" d="M815 420 C740 410 690 360 680 300 C750 310 800 350 815 420 Z" fill="#40c057"/>
  <path data-zone="feuille-2" d="M825 400 C900 390 950 340 960 280 C890 290 840 330 825 400 Z" fill="#2b8a3e"/>
  <path data-zone="feuille-3" d="M815 340 C750 320 720 260 730 200 C790 225 815 280 815 340 Z" fill="#2b8a3e"/>
  <path data-zone="feuille-4" d="M825 320 C890 300 920 240 910 180 C850 205 825 260 825 320 Z" fill="#40c057"/>
  <path data-zone="feuille-5" d="M818 300 C795 250 800 190 830 140 C850 190 845 250 822 300 Z" fill="#69db7c"/>
  <path data-zone="feuille-6" d="M815 450 C760 470 700 460 660 430 C710 420 770 425 815 450 Z" fill="#2b8a3e"/>

  <!-- Pot : rebord, corps en léger dégradé, petits points décoratifs. -->
  <path data-zone="pot" d="M720 470 L920 470 L895 595 L745 595 Z" fill="url(#pot)"/>
  <rect data-zone="rebord" x="705" y="440" width="230" height="34" rx="6" fill="#a8430b"/>
  <g fill="#ffd8a8">
    <circle cx="770" cy="520" r="3.5"/><circle cx="800" cy="540" r="3"/><circle cx="830" cy="520" r="3.5"/>
    <circle cx="860" cy="540" r="3"/><circle cx="785" cy="565" r="3"/><circle cx="845" cy="565" r="3.5"/>
  </g>
  <!-- Grains de terre : micro. -->
  <g fill="#5c3d2e">
    <circle cx="740" cy="438" r="2.5"/><circle cx="860" cy="436" r="2"/><circle cx="900" cy="438" r="2.5"/>
  </g>
</svg>
