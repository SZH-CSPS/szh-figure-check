<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <!-- Figure de référence 1 (graphique) : barres groupées pastel, chacune avec un léger dégradé
       vertical. Attendu : douze barres, une zone chacune, en trois séries ; la légende, le
       quadrillage et l'axe sont tolérés ; les graduations de 6 px ne sont pas des zones.
       data-zone : zone attendue ; data-tolere : zone permise ; le reste ne doit pas sortir. -->
  <defs>
    <linearGradient id="bleu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9c9ea"/><stop offset="1" stop-color="#97b9de"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7c9a3"/><stop offset="1" stop-color="#efb588"/></linearGradient>
    <linearGradient id="vert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8ddb2"/><stop offset="1" stop-color="#a2cf9b"/></linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="80" y="60" font-size="32" font-weight="bold" fill="#212529">Fréquentation des bibliothèques</text>

  <g stroke="#dee2e6" stroke-width="1.5">
    <line data-tolere="quadrillage-1" x1="140" y1="170" x2="1140" y2="170"/>
    <line data-tolere="quadrillage-2" x1="140" y1="300" x2="1140" y2="300"/>
    <line data-tolere="quadrillage-3" x1="140" y1="430" x2="1140" y2="430"/>
    <line data-tolere="quadrillage-4" x1="140" y1="560" x2="1140" y2="560"/>
  </g>
  <g font-size="18" fill="#495057" text-anchor="end">
    <text x="125" y="696">0</text><text x="125" y="566">25</text><text x="125" y="436">50</text>
    <text x="125" y="306">75</text><text x="125" y="176">100</text>
  </g>

  <g>
    <rect data-zone="bleu-1" x="180" y="380" width="70" height="310" fill="url(#bleu)"/>
    <rect data-zone="orange-1" x="255" y="450" width="70" height="240" fill="url(#orange)"/>
    <rect data-zone="vert-1" x="330" y="520" width="70" height="170" fill="url(#vert)"/>
    <rect data-zone="bleu-2" x="430" y="300" width="70" height="390" fill="url(#bleu)"/>
    <rect data-zone="orange-2" x="505" y="340" width="70" height="350" fill="url(#orange)"/>
    <rect data-zone="vert-2" x="580" y="410" width="70" height="280" fill="url(#vert)"/>
    <rect data-zone="bleu-3" x="680" y="250" width="70" height="440" fill="url(#bleu)"/>
    <rect data-zone="orange-3" x="755" y="360" width="70" height="330" fill="url(#orange)"/>
    <rect data-zone="vert-3" x="830" y="470" width="70" height="220" fill="url(#vert)"/>
    <rect data-zone="bleu-4" x="930" y="200" width="70" height="490" fill="url(#bleu)"/>
    <rect data-zone="orange-4" x="1005" y="280" width="70" height="410" fill="url(#orange)"/>
    <rect data-zone="vert-4" x="1080" y="330" width="55" height="360" fill="url(#vert)"/>
  </g>
  <!-- Valeur posée sur une barre : la barre reste une zone. -->
  <text x="965" y="240" font-size="20" fill="#212529" text-anchor="middle">94</text>

  <line data-tolere="axe" x1="140" y1="690" x2="1140" y2="690" stroke="#343a40" stroke-width="2.5"/>
  <!-- Graduations : 1,5 px sur 6 px, des micro-éléments. -->
  <g stroke="#343a40" stroke-width="1.5">
    <line x1="290" y1="691" x2="290" y2="697"/><line x1="540" y1="691" x2="540" y2="697"/>
    <line x1="790" y1="691" x2="790" y2="697"/><line x1="1035" y1="691" x2="1035" y2="697"/>
  </g>
  <g font-size="20" fill="#212529" text-anchor="middle">
    <text x="290" y="730">2021</text><text x="540" y="730">2022</text><text x="790" y="730">2023</text><text x="1035" y="730">2024</text>
  </g>

  <g font-size="18" fill="#212529">
    <rect data-tolere="legende-bleu" x="760" y="88" width="18" height="18" fill="url(#bleu)"/><text x="786" y="103">Prêts</text>
    <rect data-tolere="legende-orange" x="860" y="88" width="18" height="18" fill="url(#orange)"/><text x="886" y="103">Visites</text>
    <rect data-tolere="legende-vert" x="975" y="88" width="18" height="18" fill="url(#vert)"/><text x="1001" y="103">Ateliers</text>
  </g>
  <text x="80" y="775" font-size="15" fill="#495057">Source : données fictives</text>
</svg>
