<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <!-- Figure de référence 5 (schéma) : quatre étapes en boîtes pastel à bord plus foncé et
       léger dégradé, une boîte d'alerte rouge vif en léger dégradé, des flèches. Attendu : une
       zone par boîte (le fond de la boîte, le texte posé dessus n'y change rien), les flèches.
       Les bords des boîtes sont tolérés. Les ombres douces et les pastilles d'état de 7 px
       sont des micro-éléments : aucun ne doit sortir. -->
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7f3ff"/><stop offset="1" stop-color="#cfe6fd"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3e3"/><stop offset="1" stop-color="#ffe3c2"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eafaec"/><stop offset="1" stop-color="#cff3d5"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2efff"/><stop offset="1" stop-color="#e0d6ff"/></linearGradient>
    <linearGradient id="alerte" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5383b"/><stop offset="1" stop-color="#c62828"/></linearGradient>
    <filter id="ombre" x="-10%" y="-10%" width="130%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <marker id="pointe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#495057"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="80" y="64" font-size="32" font-weight="bold" fill="#212529">Traitement d'une demande</text>

  <!-- Ombres douces : pas des zones. -->
  <g fill="#000000" opacity="0.10" filter="url(#ombre)">
    <rect x="86" y="176" width="240" height="130" rx="16"/><rect x="456" y="176" width="240" height="130" rx="16"/>
    <rect x="826" y="176" width="240" height="130" rx="16"/><rect x="456" y="476" width="240" height="130" rx="16"/>
  </g>

  <rect data-zone="etape-1" x="80" y="170" width="240" height="130" rx="16" fill="url(#b1)"/>
  <rect data-tolere="bord-etape-1" x="80" y="170" width="240" height="130" rx="16" fill="none" stroke="#74b4f0" stroke-width="2.5"/>
  <rect data-zone="etape-2" x="450" y="170" width="240" height="130" rx="16" fill="url(#b2)"/>
  <rect data-tolere="bord-etape-2" x="450" y="170" width="240" height="130" rx="16" fill="none" stroke="#f5b26b" stroke-width="2.5"/>
  <rect data-zone="etape-3" x="820" y="170" width="240" height="130" rx="16" fill="url(#b3)"/>
  <rect data-tolere="bord-etape-3" x="820" y="170" width="240" height="130" rx="16" fill="none" stroke="#7bcf8a" stroke-width="2.5"/>
  <rect data-zone="etape-4" x="450" y="470" width="240" height="130" rx="16" fill="url(#b4)"/>
  <rect data-tolere="bord-etape-4" x="450" y="470" width="240" height="130" rx="16" fill="none" stroke="#a593f0" stroke-width="2.5"/>
  <rect data-zone="alerte" x="850" y="480" width="200" height="110" rx="12" fill="url(#alerte)"/>

  <g font-size="22" fill="#212529" text-anchor="middle">
    <text x="200" y="242">Réception</text><text x="570" y="242">Analyse</text>
    <text x="940" y="242">Décision</text><text x="570" y="542">Archivage</text>
  </g>
  <text x="950" y="542" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Recours</text>

  <!-- Pastilles d'état : micro. -->
  <circle cx="300" cy="190" r="3.5" fill="#2f9e44"/><circle cx="670" cy="190" r="3.5" fill="#f08c00"/>
  <circle cx="1040" cy="190" r="3.5" fill="#2f9e44"/><circle cx="670" cy="490" r="3.5" fill="#868e96"/>

  <g fill="none" stroke="#495057" stroke-width="3.5" marker-end="url(#pointe)">
    <line data-zone="fleche-1" x1="325" y1="235" x2="440" y2="235"/>
    <line data-zone="fleche-2" x1="695" y1="235" x2="810" y2="235"/>
    <!-- Une flèche qui se divise : un seul tracé à l'impression, une seule zone. -->
    <g data-zone="fleche-3">
      <path d="M940 305 L940 380 L570 380 L570 460"/>
      <line x1="940" y1="380" x2="940" y2="470"/>
    </g>
  </g>
  <text x="80" y="760" font-size="15" fill="#495057">Schéma de principe</text>
</svg>
